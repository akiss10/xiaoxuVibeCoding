<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07060f" />
    <title>有些话，想亲口对你说</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%9D%A4%EF%B8%8F%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <!-- ================= 背景层 ================= -->
    <canvas id="starfield" aria-hidden="true"></canvas>
    <div class="fx-layer" aria-hidden="true">
      <div class="petals" id="petals"></div>
      <div class="mouse-glow" id="mouseGlow"></div>
    </div>
    <div class="grain" aria-hidden="true"></div>

    <!-- ================= 主舞台 ================= -->
    <main id="app" class="app">
      <!-- ---------- 封面 ---------- -->
      <section class="scene cover is-active" id="scene-cover">
        <div class="halo"></div>
        <div class="cover-inner">
          <p class="eyebrow" data-text="To Someone Special">To Someone Special</p>
          <h1 class="cover-title" id="coverTitle"></h1>
          <div class="cover-heart">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <path
                id="coverHeartPath"
                d="M60 104S14 76 14 45.5C14 30.5 25.5 19 40.5 19c8.4 0 15.9 4 19.5 10.2C63.6 23 71.1 19 79.5 19 94.5 19 106 30.5 106 45.5 106 76 60 104 60 104z"
                fill="none"
                stroke="url(#coverHeartGrad)"
                stroke-width="2.4"
                stroke-linecap="round"
              />
              <defs>
                <linearGradient id="coverHeartGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#ffd8a8" />
                  <stop offset="55%" stop-color="#ff5c8a" />
                  <stop offset="100%" stop-color="#a15cff" />
                </linearGradient>
              </defs>
            </svg>
          </div>
          <p class="cover-sub" id="coverSub"></p>
          <button class="enter-btn" id="enterBtn" type="button">
            <span class="enter-ring"></span>
            <span class="enter-text" id="enterText">开 始</span>
          </button>
          <p class="cover-tip" id="coverTip"></p>
        </div>
      </section>

      <!-- ---------- 第一幕：星夜写名字 ---------- -->
      <section class="scene" id="scene-1">
        <div class="scene-inner center">
          <p class="eyebrow" id="s1Eyebrow"></p>
          <p class="lead" id="s1Pre"></p>
          <h2 class="her-name" id="herName"></h2>
          <p class="lead after" id="s1After"></p>
        </div>
      </section>

      <!-- ---------- 第二幕：一句一句靠近 ---------- -->
      <section class="scene" id="scene-2">
        <div class="scene-inner center">
          <p class="eyebrow" id="s2Eyebrow"></p>
          <div class="beat-lines" id="beatLines"></div>
          <div class="pulse-heart" id="pulseHeart">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <path
                d="M60 104S14 76 14 45.5C14 30.5 25.5 19 40.5 19c8.4 0 15.9 4 19.5 10.2C63.6 23 71.1 19 79.5 19 94.5 19 106 30.5 106 45.5 106 76 60 104 60 104z"
                fill="rgba(255,92,138,.16)"
                stroke="rgba(255,92,138,.85)"
                stroke-width="2"
              />
            </svg>
          </div>
        </div>
      </section>

      <!-- ---------- 第三幕：信 ---------- -->
      <section class="scene" id="scene-3">
        <div class="scene-inner">
          <p class="eyebrow" id="s3Eyebrow"></p>
          <article class="letter" id="letter">
            <div class="letter-paper" aria-hidden="true"></div>
            <div class="letter-sheen" id="letterSheen" aria-hidden="true"></div>
            <div class="letter-body" id="letterBody"></div>
            <p class="letter-sign">
              <span id="s3Sign"></span> <span class="sign-name" id="signName"></span>
            </p>
          </article>
        </div>
      </section>

      <!-- ---------- 第四幕：提问 ---------- -->
      <section class="scene" id="scene-4">
        <div class="scene-inner center">
          <p class="eyebrow" id="s4Eyebrow"></p>
          <h2 class="question" id="question"></h2>
          <div class="answer-row" id="answerRow">
            <button class="btn btn-yes" id="btnYes" type="button"></button>
            <button class="btn btn-no" id="btnNo" type="button"></button>
            <span class="heart-plane" id="heartPlane" aria-hidden="true">❤</span>
          </div>
          <p class="whisper" id="whisper"></p>
        </div>
      </section>

      <!-- ---------- 第五幕：终章 ---------- -->
      <section class="scene" id="scene-5">
        <div class="scene-inner center">
          <p class="eyebrow" id="s5Eyebrow"></p>
          <h2 class="final-big" id="finalBig"></h2>
          <div class="final-heart" id="finalHeart">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <path
                id="finalHeartPath"
                d="M60 104S14 76 14 45.5C14 30.5 25.5 19 40.5 19c8.4 0 15.9 4 19.5 10.2C63.6 23 71.1 19 79.5 19 94.5 19 106 30.5 106 45.5 106 76 60 104 60 104z"
                fill="url(#finalGrad)"
              />
              <defs>
                <radialGradient id="finalGrad" cx="35%" cy="28%" r="80%">
                  <stop offset="0%" stop-color="#ffe3ef" />
                  <stop offset="45%" stop-color="#ff5c8a" />
                  <stop offset="100%" stop-color="#8a1fff" />
                </radialGradient>
              </defs>
            </svg>
          </div>
          <p class="final-date" id="finalDate"></p>
          <div class="final-actions">
            <button class="btn btn-ghost" id="btnSecret" type="button"></button>
            <button class="btn btn-ghost" id="btnReplay" type="button"></button>
          </div>
        </div>
      </section>
    </main>

    <!-- ================= 固定 UI ================= -->
    <div class="hud" id="hud">
      <div class="rail" id="rail" role="progressbar" aria-label="进度">
        <span class="rail-fill" id="railFill"></span>
        <i class="rail-dot" data-i="0"></i>
        <i class="rail-dot" data-i="1"></i>
        <i class="rail-dot" data-i="2"></i>
        <i class="rail-dot" data-i="3"></i>
        <i class="rail-dot" data-i="4"></i>
      </div>
      <div class="hud-right">
        <button class="icon-btn" id="btnSound" type="button" aria-label="声音开关"></button>
      </div>
    </div>
    <p class="skip-hint" id="skipHint"></p>

    <!-- ================= 隐藏彩蛋 ================= -->
    <div class="secret" id="secret" aria-hidden="true">
      <div class="secret-card">
        <p class="secret-label" id="secretLabel"></p>
        <h3 class="secret-title" id="secretTitle"></h3>
        <p class="secret-body" id="secretBody"></p>
      </div>
    </div>

    <!-- ================= 光标 ================= -->
    <div class="cursor" id="cursor" aria-hidden="true"></div>
    <div class="cursor-dot" id="cursorDot" aria-hidden="true"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
